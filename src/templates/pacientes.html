{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pacientes | Gestor de Pacientes UBS</title>

    <!-- Estilos principais -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <!-- Ícones Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- Cabeçalho -->
    <header class="main-header">
      <div class="header-content">
        <div class="logo-title">
          <div class="logo-container">
            <i class="fa-solid fa-hospital"></i>
          </div>
          <h1>Gestor de Pacientes UBS</h1>
        </div>

        <div class="user-info">
          <span>Dr. Admin <small>Equipe UBS</small></span>
          <a href="{% url 'login' %}" class="btn-logout">
            <i class="fa-solid fa-right-from-bracket"></i> Sair
          </a>
        </div>
      </div>
    </header>

    <!-- Conteúdo principal -->
    <main class="patients-page">
      <div class="page-header">
        <div class="page-title">
          <h2>Pacientes</h2>
          <p>Gerencie todos os pacientes da UBS</p>
        </div>

        <div class="page-actions">
          <a href="{% url 'dashboard' %}" class="btn btn-secondary">
            <i class="fa-solid fa-table-columns"></i> Dashboard
          </a>
          <button class="btn btn-primary" id="add-patient-btn-list">
            <i class="fa-solid fa-plus"></i> Novo Paciente
          </button>
        </div>
      </div>

      <!-- Barra de filtros -->
      <section class="filters-bar">
        <div class="search-bar">
          <i class="fa-solid fa-search"></i>
          <input
            type="text"
            placeholder="Buscar por nome, CPF ou comorbidade..."
          />
        </div>

        <div class="order-by">
          <label for="order-select">Ordenar por:</label>
          <select id="order-select">
            <option value="status">Status</option>
            <option value="name">Nome (A-Z)</option>
          </select>
        </div>

        <span class="results-count">0 pacientes encontrados</span>
      </section>

      <!-- Lista dinâmica de pacientes -->
      <section class="patient-list">
        <!-- Conteúdo é gerado dinamicamente via script.js -->
      </section>
    </main>

    <!-- Modal de adicionar paciente -->
    <div class="modal-overlay" id="add-patient-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Adicionar Novo Paciente</h2>
          <button class="close-modal-btn" aria-label="Fechar">&times;</button>
        </div>

        <form class="add-patient-form" novalidate>
          <div class="form-row">
            <div class="input-group">
              <label for="nome-completo">Nome Completo *</label>
              <input
                type="text"
                id="nome-completo"
                placeholder="Nome completo do paciente"
                required
              />
            </div>

            <div class="input-group">
              <label for="cpf">CPF *</label>
              <input
                type="text"
                id="cpf"
                placeholder="000.000.000-00"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="data-nascimento">Data de Nascimento *</label>
              <input type="date" id="data-nascimento" required />
            </div>

            <div class="input-group">
              <label for="telefone">Telefone</label>
              <input type="text" id="telefone" placeholder="(00) 00000-0000" />
            </div>

            <div class="input-group">
              <label for="data-consulta">Data da Consulta *</label>
              <input type="date" id="data-consulta" required />
            </div>
          </div>

          <div class="input-group">
            <label for="comorbidade">Comorbidade *</label>
            <select id="comorbidade" required>
              <option value="" disabled selected>
                Selecione a comorbidade
              </option>
              <option value="hipertensao">Hipertensão</option>
              <option value="diabetes">Diabetes</option>
              <option value="gestante">Gestante</option>
            </select>
          </div>

          <div class="input-group">
            <label for="observacoes">Observações</label>
            <textarea
              id="observacoes"
              placeholder="Observações adicionais sobre o paciente..."
              maxlength="500"
            ></textarea>
            <small class="char-counter">0/500 caracteres</small>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary cancel-btn">
              Cancelar
            </button>
            <button type="submit" class="btn btn-primary">
              Salvar Paciente
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Modal de Detalhes do Paciente -->
    <div class="modal-overlay" id="patient-details-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Detalhes do Paciente</h2>
          <button
            class="close-modal-btn"
            id="close-details-btn"
            aria-label="Fechar"
          >
            &times;
          </button>
        </div>

        <form class="patient-details-form" novalidate>
          <div class="form-row">
            <div class="input-group">
              <label for="detalhe-nome">Nome Completo</label>
              <input type="text" id="detalhe-nome" readonly />
            </div>

            <div class="input-group">
              <label for="detalhe-cpf">CPF</label>
              <input type="text" id="detalhe-cpf" readonly />
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="detalhe-data-nasc">Data de Nascimento</label>
              <input type="date" id="detalhe-data-nasc" readonly />
            </div>

            <div class="input-group">
              <label for="detalhe-telefone">Telefone</label>
              <input type="text" id="detalhe-telefone" readonly />
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="detalhe-comorbidade">Comorbidade</label>
              <select id="detalhe-comorbidade" disabled>
                <option value="hipertensao">Hipertensão</option>
                <option value="diabetes">Diabetes</option>
                <option value="gestante">Gestante</option>
              </select>
            </div>

            <div class="input-group">
              <label for="detalhe-data-consulta">Data da Consulta</label>
              <input type="date" id="detalhe-data-consulta" readonly />
            </div>
          </div>

          <div class="form-row">
            <div class="input-group">
              <label for="detalhe-proxima-consulta">Próxima Consulta</label>
              <input type="date" id="detalhe-proxima-consulta" readonly />
            </div>

            <div class="input-group">
              <label for="detalhe-status">Status</label>
              <input type="text" id="detalhe-status" readonly />
            </div>
          </div>

          <div class="input-group">
            <label for="detalhe-observacoes">Observações</label>
            <textarea id="detalhe-observacoes" readonly></textarea>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              id="editar-paciente-btn"
            >
              Editar
            </button>
            <button
              type="button"
              class="btn btn-danger"
              id="excluir-paciente-btn"
            >
              Excluir
            </button>
            <button
              type="submit"
              class="btn btn-primary"
              id="salvar-edicao-btn"
              style="display: none"
            >
              Salvar
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Script principal -->
    <script src="{% static 'js/script.js' %}" defer></script>
  </body>
</html>
